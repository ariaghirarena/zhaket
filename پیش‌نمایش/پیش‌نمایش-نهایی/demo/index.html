<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دموی پنل مدیریت بچرخون</title>
<meta name="description" content="دموی استاتیک پنل مدیریت افزونهٔ بچرخون — رابط واقعی افزونه با دادهٔ نمونه.">
<meta name="robots" content="noindex,nofollow">

<!-- استایل واقعی افزونه، بدون هیچ تغییری -->
<link rel="stylesheet" href="plugin/assets/front/wheel.css">
<link rel="stylesheet" href="plugin/assets/admin/app.css">
<!-- فقط سازگاری پوستهٔ استاتیک + فونت محلی -->
<link rel="stylesheet" href="demo.css">
</head>
<body class="bch-demo">

<div class="bch-demo-bar" role="status">
  <span class="dot" aria-hidden="true"></span>
  <span><b>حالت دمو:</b> این رابط، <b>رابط واقعی افزونه</b> است که با دادهٔ نمونه کار می‌کند —
    هیچ عملی روی سایت واقعی ذخیره نمی‌شود.</span>
  <span class="sp"><a href="../index.html">بازگشت به معرفی</a></span>
</div>

<!-- همان مارک‌آپ صفحهٔ مدیریت افزونه (Admin::render) -->
<div class="bch-shell">
  <div class="wrap bch-wrap">
    <div id="bch-app">
      <div class="bc-boot">
        <img src="plugin/assets/img/mark.svg" width="56" height="56" alt="">
        <div class="bc-spinner"></div>
        <p>ARIAGH.BECHARKHOON</p>
      </div>
    </div>
    <noscript>
      <div class="bch-fatal"><b>جاوااسکریپت لازم است</b>
        پنل مدیریت بچرخون یک برنامهٔ تک‌صفحه‌ای است؛ برای دیدن دمو، جاوااسکریپت مرورگر را فعال کن.</div>
    </noscript>
  </div>
</div>

<div class="bch-demo-foot">
  <span><b>دادهٔ نمونه:</b> فروشگاه demo-shop.ir · بدون سرور، بدون دیتابیس، بدون ارسال پیامک</span>
  <span class="sp"><a href="../index.html">صفحهٔ معرفی</a></span>
</div>

<script>
/* ---------------------------------------------------------------------------
   تنظیمات runtime — دقیقاً همان کلیدی که wp_localize_script می‌سازد (BCH).
   مقادیر حساس و واقعی حذف شده‌اند؛ مسیر API به رهگیر محلی اشاره می‌کند.
   --------------------------------------------------------------------------- */
window.BCH = {
  root: 'becharkhoon/v1/',
  nonce: 'demo',
  exportUrl: '',
  route: 'dashboard',
  routes: [ 'dashboard', 'wheels', 'rules', 'spins', 'leads', 'credits', 'campaigns',
            'reports', 'sms', 'settings', 'tools', 'guide' ],
  fa: true,
  theme: 'light',
  brand: '',
  pluginUrl: 'plugin/',
  homeUrl: 'https://demo-shop.ir/',
  adminUrl: '#',
  version: '',
  woo: true,
  canManage: true,
  user: 'مدیر فروشگاه'
};

/* کانفیگ گردونهٔ فرانت که Frontend::js_config می‌دهد (برای پیش‌نمایش داخل ادیتور) */
window.BECHARKHOON = {
  root: 'becharkhoon/v1/',
  nonce: 'demo',
  admin: true,
  fa: true,
  rtl: true,
  ajax: '',
  openParam: 'bch_open',
  adminOpenParam: 'bch-open',
  currency: 'تومان',
  digits: 'fa',
  site: 'https://demo-shop.ir/'
};
</script>

<!-- ۳۶ تم واقعی افزونه (کپی assets/data/themes.json) -->
<script src="themes-data.js"></script>

<!-- رهگیر REST — باید قبل از هر فایل UI بیاید -->
<script src="mock-api.js"></script>

<!-- دارایی‌های واقعی افزونه، به‌ترتیب وابستگی‌ها (همان ترتیبی که Admin::assets صف می‌کند) -->
<script src="plugin/assets/front/wheel.js"></script>
<script src="plugin/assets/admin/ui.js"></script>
<script src="plugin/assets/admin/charts.js"></script>
<script src="plugin/assets/admin/fields.js"></script>
<script src="plugin/assets/admin/editor.js"></script>
<script src="plugin/assets/admin/pages.js"></script>
<script src="plugin/assets/admin/app.js"></script>

<!-- اگر چیزی بارگذاری نشد، صادقانه بگو -->
<script>
setTimeout(function () {
  var app = document.getElementById('bch-app');
  if (app && app.querySelector('.bc-boot')) {
    app.innerHTML = '<div class="bch-fatal"><b>پنل بارگذاری نشد</b>' +
      'یکی از فایل‌های پنل پیدا نشد. مطمئن شو پوشهٔ <code>demo/plugin/</code> کنار همین فایل است ' +
      'و صفحه را با http باز کرده‌ای (نه با file://).</div>';
  }
}, 6000);
</script>
</body>
</html>
