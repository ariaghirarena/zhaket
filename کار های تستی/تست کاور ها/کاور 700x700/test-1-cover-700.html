<title>بچرخون — کاور ۷۰۰×۷۰۰ | تست ۱</title>
<style>
  :root{ --forest:#2A5125; --deep:#1E381B; --cream:#F2F0E6; --gold:#FFC517; --orange:#E47C12; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif;
    background:#0C180B; color:var(--cream); min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:22px 16px 40px; gap:14px;
    -webkit-font-smoothing:antialiased;
  }
  .head{ display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center }
  .head h1{ font-size:15px; font-weight:700; margin:0; letter-spacing:.01em; color:#DCEBD2 }
  .head p{ margin:0; font-size:11.5px; color:#8FA585 }
  .stage{ position:relative; width:700px; height:700px; flex:0 0 auto;
    border-radius:8px; overflow:hidden; background:var(--deep);
    box-shadow:0 30px 90px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.06) inset }
  #plateSvg{ display:block; width:100%; height:100% }

  .bar{ position:fixed; inset-inline-start:14px; bottom:14px; z-index:50;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    background:rgba(11,26,10,.93); border:1px solid rgba(242,240,230,.16);
    border-radius:14px; padding:10px 12px; max-width:min(620px,calc(100vw - 28px));
    box-shadow:0 18px 44px rgba(0,0,0,.55); backdrop-filter:blur(10px) }
  .bar button{ cursor:pointer; border:0; border-radius:9px; padding:9px 13px;
    font:700 12.5px/1.1 inherit; color:#0F2410; background:var(--cream);
    transition:transform .12s ease, filter .12s ease }
  .bar button:hover{ filter:brightness(1.06); transform:translateY(-1px) }
  .bar button.primary{ background:linear-gradient(180deg,#FFD75E,#FFC517); color:#3A2B00 }
  .bar button.ghost{ background:rgba(242,240,230,.10); color:#E4F0DA;
    border:1px solid rgba(242,240,230,.22) }
  .bar .note{ flex-basis:100%; font:500 10.5px/1.6 inherit; color:#93A98C; margin:0 }
  .bar .note b{ color:#C9DCBE; font-weight:700 }
  .bar.hidden{ display:none }

  #toast{ position:fixed; inset-inline:0; bottom:96px; display:flex; justify-content:center;
    pointer-events:none; z-index:60 }
  #toast span{ background:rgba(11,26,10,.95); border:1px solid rgba(242,240,230,.22);
    color:var(--cream); font:700 12px/1.5 inherit; padding:10px 18px; border-radius:999px;
    opacity:0; transform:translateY(8px); transition:.24s ease }
  #toast.on span{ opacity:1; transform:translateY(0) }

  @media (max-width:740px){
    body{ padding:12px 8px 96px }
    .stage{ transform-origin:top center }
  }
  @media print{
    @page{ size:700px 700px; margin:0 }
    html,body{ background:#fff; padding:0; margin:0; display:block }
    .head,.bar,#toast{ display:none !important }
    .stage{ width:700px; height:700px; box-shadow:none; border-radius:0; transform:none !important }
  }
</style>
</head>

<div class="bar" id="bar">
  <button class="primary" id="b1">دانلود PNG ۷۰۰×۷۰۰</button>
  <button class="primary" id="b3">دانلود PNG ۲۱۰۰×۲۱۰۰</button>
  <button class="ghost" id="bPrint">چاپ / PDF</button>
  <button class="ghost" id="bOpen">پنجرهٔ جدید</button>
  <button class="ghost" id="bHide">پنهان</button>
  <p class="note">خروجی با کیفیت بالا از خودِ همین SVG ساخته می‌شود. اگر داخل پیش‌نمایش دانلود بسته بود،
  <b>پنجرهٔ جدید</b> را بزن، یا در مرورگر <b>Ctrl+Shift+S</b> (Safari: ⌘+S) → Save as SVG.</p>
</div>

<div id="toast"><span></span></div>

<script>
(function(){
  "use strict";
  var SVG = document.getElementById('plateSvg');
  var SIZE = 700;

  function toast(msg){
    var t = document.getElementById('toast');
    t.querySelector('span').textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 3400);
  }

  /* one canonical serialisation of the plate — identical for every export */
  function serialise(){
    var clone = SVG.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('width', SIZE);
    clone.setAttribute('height', SIZE);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  }

  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 6000);
  }

  function exportPNG(scale, label){
    var src = serialise();
    var svgBlob = new Blob([src], {type:'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      cv.width = SIZE * scale;
      cv.height = SIZE * scale;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      /* paint the base colour first: keeps edges opaque, avoids alpha fringing */
      ctx.fillStyle = '#1E381B';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      if (cv.toBlob) {
        cv.toBlob(function(b){
          if (!b) { fallback(src, label); return; }
          download(b, 'becharkhoon-cover-700-' + scale + 'x.png');
          toast(label + ' آماده شد ✓');
        }, 'image/png');
      } else {
        var d = cv.toDataURL('image/png').split(',')[1];
        var bin = atob(d), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        download(new Blob([arr], {type:'image/png'}), 'becharkhoon-cover-700-' + scale + 'x.png');
        toast(label + ' آماده شد ✓');
      }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); fallback(src, label); };
    img.src = url;
  }

  /* if canvas export is blocked (some iframes / strict policies) hand over the SVG */
  function fallback(src, label){
    download(new Blob([src], {type:'image/svg+xml;charset=utf-8'}), 'becharkhoon-cover-700.svg');
    toast('PNG بسته بود — فایل SVG ذخیره شد (در هر برنامه‌ای PNG بگیر)');
  }

  document.getElementById('b1').onclick = function(){ exportPNG(1, 'PNG ۷۰۰'); };
  document.getElementById('b3').onclick = function(){ exportPNG(3, 'PNG ۲۱۰۰'); };
  document.getElementById('bPrint').onclick = function(){ window.print(); };
  document.getElementById('bOpen').onclick = function(){ window.open(location.href, '_blank', 'noopener'); };
  document.getElementById('bHide').onclick = function(){
    document.getElementById('bar').classList.add('hidden');
    toast('پنل پنهان شد — برای چاپ Ctrl+P');
  };

  /* scale the stage to fit narrow screens (the SVG itself always stays 700 logical px) */
  function fit(){
    var stage = document.getElementById('stage');
    var avail = Math.min(window.innerWidth - 20, 700);
    var k = avail / 700;
    if (k < 1){
      stage.style.transform = 'scale(' + k + ')';
      stage.style.marginBottom = (-700 * (1 - k)) + 'px';
    } else {
      stage.style.transform = ''; stage.style.marginBottom = '0';
    }
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
